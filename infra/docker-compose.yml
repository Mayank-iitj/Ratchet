version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ratchet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ratchet
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry

  egress-proxy:
    image: ubuntu/squid
    ports:
      - "3128:3128"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  registry_data:
