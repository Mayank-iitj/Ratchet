services:
  - type: web
    name: ratchet-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn apps.api.ratchet_api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ratchet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ratchet-redis
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: worker
    name: ratchet-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "arq apps.api.ratchet_api.worker.WorkerSettings"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ratchet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ratchet-redis
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: redis
    name: ratchet-redis
    ipAllowList: []
    plan: free

databases:
  - name: ratchet-db
    databaseName: ratchet
    user: ratchet
    plan: free
